{% extends "base.html" %}
{% block content %}
<h2>Create your account</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">Full name</label>
    <input class="form-control" name="name" required maxlength="120"></div>
  <div class="mb-3"><label class="form-label">Email</label>
    <input class="form-control" type="email" name="email" required maxlength="255"></div>
  <div class="mb-3"><label class="form-label">Password (min 10 characters)</label>
    <input class="form-control" type="password" name="password" required minlength="10"></div>
  <div class="mb-3"><label class="form-label">Account type</label>
    <select class="form-select" name="role">
      <option value="viewer">Viewer (see documents shared with me)</option>
      <option value="owner">Owner (upload and share documents)</option>
    </select></div>
  <button class="btn btn-primary">Register</button>
  <a class="btn btn-link" href="{{ url_for('auth.login') }}">I already have an account</a>
</form>
{% endblock %}
