<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrustVault</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">TrustVault</a>
    {% if current_user.is_authenticated %}
    <form method="post" action="{{ url_for('auth.logout') }}" class="d-flex align-items-center gap-3 m-0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <span class="text-light small">{{ current_user.name }} ({{ current_user.role }})</span>
      <button class="btn btn-outline-light btn-sm">Log out</button>
    </form>
    {% endif %}
  </div>
</nav>
<div class="container" style="max-width: 520px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
