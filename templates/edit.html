{% extends "base.html" %}
{% block content %}
<h2>Replace: {{ doc.original_name }}</h2>
<p class="text-muted">Upload a new version. It must be a .{{ old_ext }} file. The old version is replaced.</p>
<form method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">New file</label>
    <input class="form-control" type="file" name="file" required></div>
  <button class="btn btn-primary">Replace</button>
  <a class="btn btn-link" href="{{ url_for('dashboard') }}">Cancel</a>
</form>
{% endblock %}
