{% extends "base.html" %}
{% block content %}
<div class="card-tv mt-4">
  <div class="auth-logo">{% include "_logo.html" %}</div>
  <h2 class="auth-title">Welcome back</h2>
  <p class="auth-sub">Your documents. Your permissions. Your proof.</p>
  <hr class="gold-rule">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" type="email" name="email" required></div>
    <div class="mb-4"><label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" required></div>
    <button class="btn btn-primary w-100 py-2">Sign in</button>
  </form>
  <p class="text-center mt-3 mb-0 text-muted">New here?
    <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
