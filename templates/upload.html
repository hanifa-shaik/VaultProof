{% extends "base.html" %}
{% block content %}
<h2>Upload a document</h2>
<p class="text-muted">Allowed: PDF, PNG, JPG, TXT, DOCX, XLSX. Maximum 10 MB.</p>
<form method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">File</label>
    <input class="form-control" type="file" name="file" required></div>
  <div class="mb-3"><label class="form-label">Category</label>
    <select class="form-select" name="category">
      {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select></div>
  <button class="btn btn-primary">Upload</button>
  <a class="btn btn-link" href="{{ url_for('dashboard') }}">Cancel</a>
</form>
{% endblock %}
